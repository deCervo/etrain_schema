[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "etrain-schema"
version = "0.2.0"
description = "Shared Pydantic schemas for eTRAIN services and clients."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "deCervo" }
]
license = { text = "Proprietary" }
keywords = ["etrain", "schema", "pydantic", "typescript"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[project.scripts]
etrain-schema-ts = "etrain_schema.tools.generate_ts:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/etrain_schema"]
